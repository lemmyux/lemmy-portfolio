    <span class="lb-count" id="lb-count"></span>
    <div class="lb-btns">
      <button class="lb-btn" type="button" id="lb-prev" aria-label="Previous"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg></button>
      <button class="lb-btn" type="button" id="lb-next" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
      <button class="lb-btn" type="button" id="lb-close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </div>
  <div class="lb-stage" id="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-cap"><strong id="lb-title"></strong><span id="lb-alt"></span><small id="lb-meta"></small><a id="lb-link" href="#">View case study <svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></a></div>
</dialog>

<script>
(function () {
  var clock = document.getElementById('clock');
  function tick() { clock.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  tick(); setInterval(tick, 15000);

  var grid = document.getElementById('masonry');
  var tiles = [].slice.call(grid.querySelectorAll('.tile'));
  var visible = tiles;

  // Masonry: deal visible tiles into columns left to right, each going to the shortest column,
  // so the grid reads in rows (newest first) instead of top to bottom.
  var lastCols = 0;
  function layout(force) {
    var w = grid.clientWidth, n = w >= 1100 ? 3 : w >= 600 ? 2 : 1;
    if (n === lastCols && !force) return;
    lastCols = n;
    grid.querySelectorAll('.col').forEach(function (c) { c.remove(); });
    var cols = [], heights = [];
    for (var i = 0; i < n; i++) { var c = document.createElement('div'); c.className = 'col'; grid.appendChild(c); cols.push(c); heights.push(0); }
    tiles.forEach(function (t) {
      if (t.hidden) { cols[0].appendChild(t); return; }
      var k = heights.indexOf(Math.min.apply(null, heights));
      cols[k].appendChild(t);
      heights[k] += parseFloat(t.dataset.ratio) + 0.08;
    });
    grid.classList.add('built');
  }
  layout(true);
  var rt; addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { layout(false); }, 120); });

  document.querySelectorAll('.filter').forEach(function (f) {
    f.addEventListener('click', function () {
      var type = f.dataset.filter;
      document.querySelectorAll('.filter').forEach(function (o) { o.setAttribute('aria-pressed', String(o === f)); });
      tiles.forEach(function (t) { t.hidden = type !== 'all' && t.dataset.type !== type; });
      visible = tiles.filter(function (t) { return !t.hidden; });
      layout(true);
    });
  });

  // Viewer: full-size image with caption; arrows and keys move through the visible tiles.
  var lb = document.getElementById('lb'), img = document.getElementById('lb-img'), stage = document.getElementById('lb-stage');
  var link = document.getElementById('lb-link'), at = 0;
  function show(i) {
    at = (i + visible.length) % visible.length;
    var t = visible[at];
    img.src = t.dataset.full; img.alt = t.dataset.alt;
    stage.classList.toggle('tall', t.classList.contains('tall'));
    stage.classList.toggle('phone', t.classList.contains('phone'));
    stage.scrollTop = 0;
    document.getElementById('lb-count').textContent = (at + 1) + ' / ' + visible.length;
    document.getElementById('lb-title').textContent = t.dataset.title;
    document.getElementById('lb-alt').textContent = t.dataset.alt;
    document.getElementById('lb-meta').textContent = t.dataset.meta;
    link.hidden = !t.dataset.href;
    if (t.dataset.href) link.href = t.dataset.href;
  }
  tiles.forEach(function (t) { t.addEventListener('click', function () { show(visible.indexOf(t)); lb.showModal(); }); });
  document.getElementById('lb-prev').addEventListener('click', function () { show(at - 1); });
  document.getElementById('lb-next').addEventListener('click', function () { show(at + 1); });
  document.getElementById('lb-close').addEventListener('click', function () { lb.close(); });
  lb.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(at - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); show(at + 1); }
  });
  lb.addEventListener('close', function () { var t = visible[at]; if (t) t.focus(); });
})();
</script>
<script>
/* Cyber FX: boot sequence, headline decode, hover scramble and glitch. */
(function () {
  var cfg = { glitch: '.gallery-title-x', scramble: '.nav a, .filter' };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var GLYPHS = '!<>-_\\/[]{}=+*^?#%&01XZ';
  function glyph() { return GLYPHS[Math.floor(Math.random() * GLYPHS.length)]; }
  function textNodes(el) {
    var out = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    while (w.nextNode()) if (w.currentNode.nodeValue.trim()) out.push(w.currentNode);
    return out;
  }

  // Reveal an element's text left to right; unrevealed characters cycle through glyphs.
  function scramble(el, duration) {
    if (reduce || el._fxBusy) return;
    var nodes = textNodes(el);
    if (!nodes.length) return;
    el._fxBusy = true;
    var originals = nodes.map(function (n) { return n.nodeValue; });
    var total = originals.join('').length, start = performance.now();
    function frame(now) {
      var p = Math.min(1, (now - start) / duration), revealed = Math.floor(p * total), seen = 0;
      nodes.forEach(function (n, i) {
        var s = originals[i], out = '';
        for (var c = 0; c < s.length; c++, seen++) out += (seen < revealed || /\s/.test(s[c])) ? s[c] : glyph();
        n.nodeValue = out;
      });
      if (p < 1) requestAnimationFrame(frame);
      else { nodes.forEach(function (n, i) { n.nodeValue = originals[i]; }); el._fxBusy = false; }
    }
    requestAnimationFrame(frame);
  }

  // Hover scramble on nav links and buttons; width is held so nothing around them shifts.
  document.querySelectorAll(cfg.scramble).forEach(function (el) {
    function run() {
      if (el._fxBusy) return;
      el.style.minWidth = el.offsetWidth + 'px';
      scramble(el, 420);
      setTimeout(function () { el.style.minWidth = ''; }, 460);
    }
    el.addEventListener('mouseenter', run);
    el.addEventListener('focus', run);
  });

  // Glitch layers: wrap the first text run of each target in a span the CSS can split.
  document.querySelectorAll(cfg.glitch).forEach(function (el) {
    var t = textNodes(el)[0];
    if (!t) return;
    var raw = t.nodeValue, text = raw.trim(), lead = raw.slice(0, raw.indexOf(text)), tail = raw.slice(raw.indexOf(text) + text.length);
    var span = document.createElement('span');
    span.className = 'fx-glitch';
    span.setAttribute('data-text', text);
    span.textContent = text;
    var frag = document.createDocumentFragment();
    if (lead) frag.appendChild(document.createTextNode(lead));
    frag.appendChild(span);
    if (tail) frag.appendChild(document.createTextNode(tail));
    t.parentNode.replaceChild(frag, t);
  });

  function decodeHeadline() {
    var h = document.querySelector('h1');
    if (!h || reduce) return;
    h.setAttribute('aria-label', h.textContent.replace(/\s+/g, ' ').trim());
    h.style.minHeight = h.offsetHeight + 'px';
    scramble(h, 1000);
    setTimeout(function () { h.style.minHeight = ''; h.removeAttribute('aria-label'); }, 1100);
  }

  // Boot sequence: type the lines, fill the bar, then wipe upward on its own. Plays once per visit.
  var boot = document.getElementById('fx-boot');
  if (!boot) { decodeHeadline(); return; }
  var lines = [].slice.call(boot.querySelectorAll('.fx-boot-line'));
  var texts = lines.map(function (l) { return l.textContent; });
  var bar = boot.querySelector('.fx-boot-bar i');
  lines.forEach(function (l) { l.textContent = ''; });
  var t0 = performance.now(), D = 950, done = false;
  function finish() {
    if (done) return;
    done = true;
    try { sessionStorage.setItem('fx-booted', '1'); } catch (e) {}
    lines.forEach(function (l, i) { l.textContent = texts[i]; });
    bar.style.width = '100%';
    boot.classList.add('out');
    setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 650);
    setTimeout(decodeHeadline, 120);
  }
  function step(now) {
    if (done) return;
    var p = Math.min(1, (now - t0) / D);
    bar.style.width = (p * 100) + '%';
    lines.forEach(function (l, i) {
      var lp = Math.max(0, Math.min(1, p * lines.length - i * 0.8));
      l.textContent = texts[i].slice(0, Math.round(lp * texts[i].length));
    });
    if (p < 1) requestAnimationFrame(step); else setTimeout(finish, 200);
  }
  requestAnimationFrame(step);
  setTimeout(finish, 2200); // finish even if animation frames are paused (e.g. a background tab)
  boot.addEventListener('click', finish);
  window.addEventListener('keydown', finish, { once: true });
  boot.addEventListener('click', finish);
  window.addEventListener('keydown', function (e) {
    if (done || e.key === 'Tab') return;
    if (document.activeElement === muteBtn && (e.key === 'Enter' || e.key === ' ')) return;
    finish();
  });
})();
</script>
<script>
/* UI sounds: synthesised taps and hover ticks, no audio files. Browsers only allow audio after the first click or key press. */
(function () {
  var KEY = 'fx-sound', on = true;
  try { on = localStorage.getItem(KEY) !== 'off'; } catch (e) {}
  var btn = document.getElementById('fx-sound');
  var ctx = null, master = null, noise = null, lastHover = 0, hovered = null;

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.18;
    var soften = ctx.createBiquadFilter(); // rounds off any sharp edge
    soften.type = 'lowpass';
    soften.frequency.value = 1800;
    master.connect(soften);
    soften.connect(ctx.destination);
    noise = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.1), ctx.sampleRate);
    var d = noise.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  // Each sound is a high-passed noise tick plus a short sine "body", both fading out within milliseconds.
  function blip(o) {
    if (!on || !ctx || ctx.state === 'closed') return;
    var t = ctx.currentTime + 0.002;
    if (o.noise) {
      var src = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), g = ctx.createGain();
      src.buffer = noise;
      hp.type = 'highpass';
      hp.frequency.setValueAtTime(o.hp, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(o.noise, t + 0.0003);
      g.gain.setTargetAtTime(0.0001, t + 0.0003, o.nDecay);
      src.connect(hp); hp.connect(g); g.connect(master);
      src.start(t); src.stop(t + 0.1);
    }
    if (o.tone) {
      var osc = ctx.createOscillator(), og = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(o.freq, t);
      if (o.drop) osc.frequency.exponentialRampToValueAtTime(o.drop, t + (o.glide || 0.06));
      og.gain.setValueAtTime(0.0001, t);
      var a = o.attack || 0.0006;
      og.gain.linearRampToValueAtTime(o.tone, t + a);
      og.gain.setTargetAtTime(0.0001, t + a, o.tDecay);
      osc.connect(og); og.connect(master);
      osc.start(t); osc.stop(t + 0.15);
    }
  }

  // Soft, rounded pops: low sine tones with a gentle fade-in and a small downward glide, no noise hiss.
  var SOUNDS = {
    hover: { tone: 0.09, freq: 620, drop: 540, glide: 0.04, attack: 0.006, tDecay: 0.012 },
    tap:   { tone: 0.28, freq: 440, drop: 330, glide: 0.05, attack: 0.004, tDecay: 0.018 },
    press: { tone: 0.3, freq: 360, drop: 250, glide: 0.06, attack: 0.004, tDecay: 0.024 }
  };
  function play(name) { blip(SOUNDS[name]); }

  document.addEventListener('pointerover', function (e) {
    if (e.pointerType !== 'mouse') return;
    var el = e.target.closest('a, button');
    if (!el || el === hovered) return;
    hovered = el;
    var now = performance.now();
    if (now - lastHover < 45) return;
    lastHover = now;
    play('hover');
  });
  document.addEventListener('pointerout', function (e) {
    if (hovered && !hovered.contains(e.relatedTarget)) hovered = null;
  });
  document.addEventListener('pointerdown', function (e) {
    init();
    var el = e.target.closest('a, button, .fx-boot');
    if (!el) return;
    play(el.matches('.btn, .button, [data-copy], .fx-sound') ? 'press' : 'tap');
  }, true);
  document.addEventListener('keydown', function (e) {
    init();
    var a = document.activeElement;
    if ((e.key === 'Enter' || e.key === ' ') && a && a.closest && a.closest('a, button')) play('tap');
  }, true);

  function render() {
    btn.querySelector('span').textContent = on ? 'Sound on' : 'Sound off';
    btn.classList.toggle('off', !on);
  }
  btn.addEventListener('click', function () {
    on = !on;
    try { localStorage.setItem(KEY, on ? 'on' : 'off'); } catch (e) {}
    render();
    if (on) { init(); play('press'); }
  });
  render();
})();
</script>
